appId: com.multiopenvpn.app
productName: Multi OpenVPN
copyright: Copyright © 2026
directories:
  output: dist
  buildResources: build
files:
  - out/**
  - package.json
  - '!**/*.map'
asar: true
extraResources:
  # OpenVPN binaries to bundle (optional): resources/openvpn/<platform>-<arch>/ — see BUILDING.md
  - from: resources/openvpn/${os}-${arch}
    to: openvpn/${os}-${arch}
    filter: ['**/*', '!.gitkeep']
  - from: resources/tray
    to: tray
electronFuses:
  # Required: the privileged helper is this same binary started with ELECTRON_RUN_AS_NODE=1.
  runAsNode: true
  enableCookieEncryption: true
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  enableEmbeddedAsarIntegrityValidation: true
  onlyLoadAppFromAsar: true
  # The UI is loaded from file:// (module scripts need it).
  grantFileProtocolExtraPrivileges: true

mac:
  category: public.app-category.utilities
  icon: build/icon.png
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  # Signing: set CSC_LINK / CSC_KEY_PASSWORD (Developer ID Application) or have the identity in the keychain.
  # Notarization: set APPLE_API_KEY, APPLE_API_KEY_ID, APPLE_API_ISSUER and build with -c.mac.notarize=true.
  notarize: false
  target:
    - target: dmg
      arch: [x64, arm64]
    - target: zip
      arch: [x64, arm64]
dmg:
  artifactName: ${productName}-${version}-${arch}.${ext}
  sign: false

win:
  icon: build/icon.png
  extraResources:
    - from: build/win/helper.cmd
      to: helper.cmd
  target:
    - target: nsis
      arch: [x64]
    - target: portable
      arch: [x64]
  # Signing: CSC_LINK / CSC_KEY_PASSWORD (Authenticode .pfx) or win.azureSignOptions for Azure Trusted Signing.
  requestedExecutionLevel: asInvoker
nsis:
  oneClick: false
  perMachine: true
  allowElevation: true
  allowToChangeInstallationDirectory: true
  artifactName: ${productName}-Setup-${version}.${ext}
  include: build/installer.nsh
  deleteAppDataOnUninstall: false
portable:
  artifactName: ${productName}-${version}-portable.${ext}

linux:
  target: [AppImage]
  category: Network
